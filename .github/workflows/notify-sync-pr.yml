name: Notify atelier-sync about child PRs
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send child PR details to atelier-sync
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          CHILD_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GH_SYNC_TOKEN is not configured."
            exit 1
          fi

          payload="$(jq -n \
            --arg child_repo "$CHILD_REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg action "$ACTION" \
            '{event_type:"atelier-submodule-pr",client_payload:{child_repo:$child_repo,pr_number:$pr_number,head_sha:$head_sha,action:$action}}')"

          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://api.github.com/repos/NomadAnget/atelier-sync/dispatches
          echo "Dispatched $CHILD_REPO#$PR_NUMBER at $HEAD_SHA"
