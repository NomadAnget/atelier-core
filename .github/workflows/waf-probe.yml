name: WAF 探测(临时)

# 临时:从 GitHub Actions 出口对 forgejo.hurcaguari.top 发**无凭据**请求,只判断是否被 WAF 拦。跑完即删。
on:
  push:
    branches: [claude/relaxed-volta-q3av2z]
    paths: [.github/workflows/waf-probe.yml]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测
        run: |
          H=https://forgejo.hurcaguari.top
          R=Carnation/atelier-core
          echo "runner 出口 IP: $(curl -s -m 10 https://api.ipify.org)"
          probe() {  # $1=编号 $2=方法 $3=路径 [$4=Content-Type]
            local ct=()
            [ -n "${4:-}" ] && ct=(-H "Content-Type: $4" --data-binary '')
            local out
            out=$(curl -s -m 20 -X "$2" "${ct[@]}" -D - -o body.txt -w '\n%{http_code}' "$H$3" || true)
            local code=$(echo "$out" | tail -1)
            local srv=$(echo "$out" | grep -i '^server:' | head -1 | tr -d '\r')
            local wa=$(echo "$out" | grep -i '^www-authenticate:' | head -1 | tr -d '\r')
            local body=$(head -c 160 body.txt | tr '\n\r' '  ')
            echo "----- #$1 $2 $3"
            echo "  status=$code  $srv  $wa"
            echo "  body: $body"
          }
          probe 1 GET  "/"
          probe 2 GET  "/$R.git/info/refs?service=git-upload-pack"
          probe 3 POST "/$R.git/git-upload-pack" application/x-git-upload-pack-request
          probe 4 GET  "/$R.git/info/refs?service=git-receive-pack"
          probe 5 POST "/$R.git/git-receive-pack" application/x-git-receive-pack-request
          probe 6 POST "/$R.git/info/lfs/objects/batch" application/vnd.git-lfs+json
          probe 7 GET  "/api/v1/version"
          probe 8 GET  "/api/v1/repos/$R"
