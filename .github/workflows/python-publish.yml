name: Upload Python Package

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'pyproject.toml'
      - '.github/workflows/python-publish.yml'
  release:
    types: [published]

permissions:
  contents: read
  packages: write # <--- 关键：赋予 Package 写入权限

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies & build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      # 上传发布到 GitHub Packages (https://nuget.pkg.github.com/OWNER 或 ghcr)
      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m twine upload --repository-url https://noproxy.github.com/_json https://upload.github.org/ --skip-existing dist/* || true
